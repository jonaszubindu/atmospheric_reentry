[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmospheric-reentry"
version = "0.1.0"
description = "Rocket reentry simulation toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name="jonaszubindu", email="64218380+jonaszubindu@users.noreply.github.com" }
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "xarray",
    "cfgrib",
    "pymap3d",
    "joblib"
]
[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]
# Aeronautical basemap behind the ground-track plot (plot_results basemap=True)
basemap = ["contextily", "pyproj"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Pinned explicitly so that a change of ruff's default rule set does not
# break CI. Add rule families here when you want stricter linting.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py and monte_carlo_run.py are scripts in src/, not part of the package.
pythonpath = ["src", "tests"]

[tool.mypy]
# Check against the project's minimum Python so PEP 604 unions (X | None)
# are accepted rather than flagged as syntax errors.
python_version = "3.10"
ignore_missing_imports = true
# Vendored ECMWF utility (imported verbatim); not our code to type-check.
exclude = "compute_geopotential_on_ml\\.py"
